server.port=8080

# Application Name
spring.application.name=PortfolioPro

# Database Configuration: H2 In-Memory (Zero Setup, Instant UI Demo)
spring.datasource.url=jdbc:h2:mem:portfoliopro_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================================
# PostgreSQL / pgAdmin Database Configuration
